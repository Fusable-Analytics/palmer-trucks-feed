name: Update Palmer Inventory Feeds

on:
  schedule:
    - cron: '5 * * * *'   # ⏰ every hour at :05 UTC
  workflow_dispatch:       # manual run button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed so the workflow can commit/push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests certifi pillow

      # ----------------------------------------------------
      # Meta / Facebook Catalog Feed
      # ----------------------------------------------------

      - name: Generate Meta candidate XML
        run: |
          python generate_feed_xml.py

      - name: Validate Meta candidate XML exists and is non-empty
        run: |
          test -s facebook_catalog_feed_new.xml

      - name: Basic Meta XML sanity check
        run: |
          set -e
          # require at least one <listing> and required tags
          grep -q "<listing>" facebook_catalog_feed_new.xml
          grep -q "<vehicle_id>" facebook_catalog_feed_new.xml
          grep -q "<vin>" facebook_catalog_feed_new.xml
          echo "Meta candidate XML looks sane."

      # ----------------------------------------------------
      # Google Ads Business Data Feed
      # ----------------------------------------------------

      - name: Generate Google Ads candidate CSV
        run: |
          python generate_google_feed.py

      - name: Validate Google Ads candidate CSV exists and is non-empty
        run: |
          test -s google_ads_feed_new.csv

      - name: Basic Google Ads CSV sanity check
        run: |
          python - <<'PY'
          import csv

          path = "google_ads_feed_new.csv"

          with open(path, newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              rows = list(reader)

          required_columns = {
              "ID",
              "Final URL",
              "Item title",
              "Item category",
              "Status"
          }

          missing = required_columns - set(reader.fieldnames or [])

          if missing:
              raise SystemExit(
                  f"Missing required columns: {sorted(missing)}"
              )

          if not rows:
              raise SystemExit(
                  "Google Ads candidate contains no inventory rows."
              )

          if any(not row["ID"].strip() for row in rows):
              raise SystemExit(
                  "Google Ads candidate contains a blank ID."
              )

          print(
              f"Google Ads candidate looks sane: "
              f"{len(rows)} inventory rows."
          )
          PY

      # ----------------------------------------------------
      # Promote candidates only after BOTH feeds validate
      # ----------------------------------------------------

      - name: Promote candidates -> live
        run: |
          cp -f facebook_catalog_feed_new.xml facebook_catalog_feed.xml
          cp -f google_ads_feed_new.csv google_ads_feed.csv
          echo "Promoted Meta and Google Ads candidates to live."

      # ----------------------------------------------------
      # Commit live feeds
      # ----------------------------------------------------

      - name: Commit and push if feeds changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add facebook_catalog_feed.xml google_ads_feed.csv
          git add -A google_images
          if ! git diff --cached --quiet; then
            git commit -m "🤖 Auto-update inventory feeds"
            git push origin master
          else
            echo "No change in live feeds; nothing to commit."
          fi